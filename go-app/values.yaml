app:
  replicaCount: 2
  image:
    repository: ghcr.io/teiimewhy/go-app
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    name: go-app-svc
    type: ClusterIP
    port: 8000
  database:
    secretName: postgres-secret
    host: postgres-svc
    port: "5432"
    sslMode: disable

postgres:
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 5432
  service:
    name: postgres-svc
    port: 5432
  statefulSet:
    name: postgres
    serviceName: postgres
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

migrations:
  enabled: true
  image:
    repository: ghcr.io/teiimewhy/go-app-migrations
    tag: local
    pullPolicy: IfNotPresent
  job:
    name: go-app-migrations
    backoffLimit: 3
  database:
    secretName: postgres-secret
    host: postgres-svc
    port: "5432"
    sslMode: disable

htmlPage:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: stable-alpine3.24
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    name: html-page-svc
    type: ClusterIP
    port: 80
  configMap:
    contentName: html-page
    nginxName: html-nginx-config

ingress:
  enabled: true
  className: traefik
  paths:
    - path: /about
      pathType: Prefix
      serviceName: html-page-svc
      servicePort: 80
    - path: /
      pathType: Prefix
      serviceName: go-app-svc
      servicePort: 8000

existingSecret:
  name: postgres-secret
  keys:
    username: POSTGRES_USER
    password: POSTGRES_PASSWORD
    database: POSTGRES_DB

