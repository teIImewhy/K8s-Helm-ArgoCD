apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.service.name }}
  labels:
    app.kubernetes.io/name: go-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.containerPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: go-app
    app.kubernetes.io/instance: {{ .Release.Name }}
