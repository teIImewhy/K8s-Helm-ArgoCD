apiVersion: v1
kind: ConfigMap
metadata:
  name: html-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = /about {
            alias /usr/share/nginx/html/index.html;
            default_type text/html;
        }

        location = /about/ {
            alias /usr/share/nginx/html/index.html;
            default_type text/html;
        }
    }
