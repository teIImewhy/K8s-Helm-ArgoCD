# Source: go-app/templates/go-app-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
  labels:
    app.kubernetes.io/name: go-app
    app.kubernetes.io/instance: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-app
      app.kubernetes.io/instance: go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-app
        app.kubernetes.io/instance: go
    spec:
      containers:
        - name: go-app
          image: "ghcr.io/teiimewhy/go-app:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DB_HOST
              value: "postgres-svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
---
# Source: go-app/templates/html-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-page
  labels:
    app.kubernetes.io/name: html-page
    app.kubernetes.io/instance: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: html-page
      app.kubernetes.io/instance: go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: html-page
        app.kubernetes.io/instance: go
    spec:
      containers:
        - name: nginx
          image: "nginx:stable-alpine3.24"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: html-content
          configMap:
            name: html-page
        - name: nginx-config
          configMap:
            name: html-nginx-config
---
# Source: go-app/templates/postgres-statefulset.yml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: go
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: go
    spec:
      containers:
        - name: postgres
          image: "postgres:17"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
# Source: go-app/templates/migration-job.yml
apiVersion: batch/v1
kind: Job
metadata:
  name: go-app-migrations
  labels:
    app.kubernetes.io/name: go-app-migrations
    app.kubernetes.io/instance: go
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-app-migrations
        app.kubernetes.io/instance: go
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "ghcr.io/teiimewhy/go-app-migrations:local"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: "postgres-svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
---
# Source: go-app/templates/ingress.yml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-ingress
  labels:
    app.kubernetes.io/name: go-app
    app.kubernetes.io/instance: go
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /about
            pathType: Prefix
            backend:
              service:
                name: html-page-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-app-svc
                port:
                  number: 8000
